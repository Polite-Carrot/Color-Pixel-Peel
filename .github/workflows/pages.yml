# Publishes the built game to GitHub Pages.
#
# This repo cannot be served from its own root the way Color Match &
# Merge can: that game is plain JS and CSS a browser runs as-is, while
# this one is TypeScript behind Vite. Serving the root gives the
# unbuilt source — index.html asking for /src/main.ts, which no browser
# executes, and fonts.css and the lockup, which only exist under
# public/ until a build moves them.
#
# So Pages is fed dist/ instead. This needs the repository's Pages
# source set to "GitHub Actions" (Settings -> Pages -> Build and
# deployment -> Source), not "Deploy from a branch".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and tests gate the deploy, so a broken build cannot
      # replace a working site.
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
